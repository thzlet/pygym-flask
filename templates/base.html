<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PyGym{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="logo" href="{{ url_for('index') }}">🐍 PyGym</a>
    <span class="sub">Pratique, teste e aprenda com feedback na hora</span>
  </header>
  <main class="container">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
        <div class="aviso {{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="rodape">Projeto Flask</footer>
</body>
</html>
